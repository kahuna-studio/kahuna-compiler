[package]
name = "kahuna-compiler"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kahuna-compiler"
path = "src/main.rs"

[dependencies]
eyre = "0.6.14"
notify-debouncer-mini = "0.7.0"
pest = "2.9.0"
pest_derive = "2.9.0"
salsa = "0.28.2"
similar = "3.2.0"
indexmap = "2.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.8.0"
lazy_static = "1.5.0"
clap = { version = "4.6.7", features = ["derive"] }
